name: Build & Release Direct Android APK + Web PWA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 for Android Gradle Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Stamp Dynamic Build Version in dist/version.json
        run: |
          mkdir -p dist
          if [ -f public/version.json ]; then cp public/version.json dist/version.json; fi
          BUILD_VER="2.4.${{ github.run_number }}"
          node --input-type=commonjs -e "
            const fs = require('fs');
            const p = 'dist/version.json';
            const v = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : {};
            v.version = '$BUILD_VER';
            v.buildNumber = Number('${{ github.run_number }}') || Date.now();
            v.releasedAt = new Date().toISOString();
            v.apkDownloadUrl = 'https://github.com/${{ github.repository }}/releases/latest/download/LeadVault40K.apk';
            fs.writeFileSync(p, JSON.stringify(v, null, 2));
          "

      - name: Package Native Android APK via Capacitor & Gradle
        run: |
          mkdir -p apk-builder
          cp -r dist apk-builder/dist
          cp capacitor.config.json apk-builder/capacitor.config.json
          cd apk-builder
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../LeadVault40K.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadVault40K-Android-APK
          path: LeadVault40K.apk

      - name: Publish Public Direct-Download GitHub Release (No Login Needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.4.${{ github.run_number }}"
          gh release create "$TAG" LeadVault40K.apk \
            --title "خزنة واتساب 40K - الإصدار $TAG (Android APK)" \
            --notes "تحميل مباشر لتطبيق أندرويد بدون الحاجة لحساب GitHub عبر الرابط المباشر: https://github.com/${{ github.repository }}/releases/latest/download/LeadVault40K.apk" \
            --latest
